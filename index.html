<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF3EC;
    --surface:#FFFFFF;
    --ink:#1F2A37;
    --ink-muted:#647079;
    --line:rgba(31,42,55,0.09);
    --success:#3FAE6B;
    --success-soft:#E4F5EA;
    --shadow: 0 1px 2px rgba(31,42,55,0.04), 0 8px 20px -10px rgba(31,42,55,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(31,42,55,0.06) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:28px 20px 40px;
  }
  .app{max-width:640px;margin:0 auto;}

  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    gap:8px;
  }
  .eyebrow-actions{display:flex; gap:8px;}
  .eyebrow button{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink-muted);
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .eyebrow button:hover{color:var(--ink); border-color:rgba(31,42,55,0.2);}
  .day-nav{display:flex; gap:4px;}
  .day-nav button{padding:6px 10px; font-size:12px;}
  #lockBtn:disabled{opacity:0.45; cursor:default;}
  #lockBtn:disabled:hover{color:var(--ink-muted); border-color:var(--line);}

  .titlerow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px;}
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:34px;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
  }
  .title-group{display:flex; align-items:center; gap:14px; flex-wrap:wrap; flex:1; min-width:0;}
  .counter-pill{
    display:flex; flex-direction:column; align-items:flex-start; gap:5px;
    background:#FFF6E0; border:1px solid #F0D48A; color:#8a6d1a;
    font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
    padding:8px 14px; border-radius:14px; cursor:pointer;
    flex:1; min-width:180px; max-width:360px;
  }
  .counter-pill.reached{background:var(--success-soft); border-color:#9FD9B4; color:#1f7a44;}
  .counter-pill .clabel{white-space:nowrap;}
  .counter-track{
    width:100%; height:7px; border-radius:5px; background:rgba(138,109,26,0.18); overflow:hidden;
  }
  .counter-pill.reached .counter-track{background:rgba(31,122,68,0.18);}
  .counter-fill{height:100%; background:#B8860B; border-radius:5px; transition:width .3s ease;}
  .counter-pill.reached .counter-fill{background:var(--success);}
  .add-task-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--ink); color:#fff; border:none;
    padding:11px 16px; border-radius:12px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px;
    cursor:pointer; flex-shrink:0;
    box-shadow:0 6px 16px -6px rgba(31,42,55,0.4);
  }
  .add-task-btn:hover{background:#33404d;}
  .add-task-btn .plus{font-size:17px; line-height:1;}

  .profiles{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:22px;
  }
  .profile-tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    flex-shrink:0;
    padding:2px;
  }
  .ring{
    width:64px;height:64px;
    border-radius:50%;
    display:grid;place-items:center;
    position:relative;
    transition: filter .15s ease;
  }
  .ring .avatar{
    width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:18px;
    color:#fff;
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }
  .profile-tab .pname{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-muted);
    max-width:76px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .profile-tab.active .pname{color:var(--ink);}
  .profile-tab:not(.active) .ring{opacity:0.55;}
  .profile-tab:not(.active):hover .ring{opacity:0.8;}
  .pstars{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    color:var(--ink-muted);
  }

  .section{margin-bottom:22px;}
  .section-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
    padding-left:2px;
  }
  .section-head .icon{font-size:15px;}
  .section-head h2{
    font-family:'Baloo 2',sans-serif;
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .section-head .count{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-muted);
  }
  .section-head .hint{
    font-size:11px;
    color:var(--ink-muted);
    font-style:italic;
    margin-left:auto;
  }

  .task-list{display:flex; flex-direction:column; gap:8px;}
  .task-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:var(--shadow);
    transition: background .15s ease, opacity .15s ease;
  }
  .task-card.done{background:var(--success-soft);}
  .task-card.locked{opacity:0.55;}
  .check:disabled{cursor:default;}

  .check{
    width:28px;height:28px;
    border-radius:9px;
    border:2px solid rgba(31,42,55,0.2);
    background:#fff;
    display:grid;place-items:center;
    cursor:pointer;
    flex-shrink:0;
    position:relative;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .check:hover{border-color:var(--ink);}
  .check.checked{
    background:var(--success);
    border-color:var(--success);
    transform:scale(1.06);
  }
  .check svg{width:15px;height:15px; opacity:0; transform:scale(0.5); transition:all .15s ease;}
  .check.checked svg{opacity:1; transform:scale(1);}

  .burst{position:absolute; inset:-10px; pointer-events:none;}
  .burst span{
    position:absolute; top:50%; left:50%;
    width:4px;height:4px; border-radius:50%;
    background:var(--success);
    opacity:0;
  }
  .check.burstnow .burst span{animation: pop .5s ease forwards;}
  .check.burstnow .burst span:nth-child(1){--dx:-14px; --dy:-10px;}
  .check.burstnow .burst span:nth-child(2){--dx:14px; --dy:-10px;}
  .check.burstnow .burst span:nth-child(3){--dx:-16px; --dy:6px;}
  .check.burstnow .burst span:nth-child(4){--dx:16px; --dy:6px;}
  .check.burstnow .burst span:nth-child(5){--dx:0px; --dy:-16px;}
  @keyframes pop{
    0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3);}
  }

  .task-icon{
    font-size:19px;
    width:24px;
    text-align:center;
    flex-shrink:0;
  }

  .task-name{
    flex:1;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
  }
  .task-card.done .task-name{color:var(--ink-muted); text-decoration:line-through; text-decoration-color:rgba(31,42,55,0.3);}

  .star-chip{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#B8860B;
    background:#FFF6E0;
    border-radius:20px;
    padding:3px 8px;
    flex-shrink:0;
  }
  .edit-btn{
    background:none; border:none; color:var(--ink-muted);
    cursor:pointer; font-size:14px;
    padding:2px 4px; flex-shrink:0;
  }
  .edit-btn:hover{color:var(--ink);}

  .del-btn{
    background:none; border:none; color:var(--ink-muted);
    cursor:pointer; font-size:15px; opacity:0; transition:opacity .1s ease;
    padding:2px 4px; flex-shrink:0;
  }
  .task-card:hover .del-btn{opacity:0.6;}
  .del-btn:hover{opacity:1 !important; color:#D9534F;}

  .empty{
    font-size:13px;
    color:var(--ink-muted);
    padding:14px 4px;
    font-style:italic;
  }

  .repeat-note{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    color:var(--ink-muted);
    margin:-8px 0 20px;
    line-height:1.5;
  }

  .loading{
    display:flex; align-items:center; justify-content:center;
    min-height:60vh; color:var(--ink-muted); font-size:14px;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(31,42,55,0.35);
    display:none; align-items:flex-end; justify-content:center;
    z-index:30;
  }
  .overlay.open{display:flex;}
  @media (min-width:520px){ .overlay{align-items:center;} }
  .modal{
    background:#fff; border-radius:20px 20px 0 0;
    width:100%; max-width:420px;
    padding:22px 22px 26px;
    box-shadow:0 -10px 40px rgba(31,42,55,0.2);
    max-height:88vh;
    overflow-y:auto;
  }
  @media (min-width:520px){ .modal{border-radius:20px;} }
  .modal h3{
    font-family:'Baloo 2',sans-serif; font-size:20px; margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:11.5px; font-weight:600; color:var(--ink-muted);
    text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;
  }
  .field input[type=text]{
    width:100%; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); font-size:14.5px; font-family:'Inter',sans-serif;
    background:var(--bg);
  }
  .field input[type=text]:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg button{
    padding:8px 13px; border-radius:20px; border:1px solid var(--line);
    background:var(--bg); font-size:13px; font-weight:600; color:var(--ink-muted);
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .seg button.sel{background:var(--ink); color:#fff; border-color:var(--ink);}

  .profile-pick{display:flex; gap:10px; flex-wrap:wrap;}
  .profile-pick button{
    display:flex; align-items:center; gap:7px;
    padding:6px 12px 6px 6px; border-radius:24px; border:2px solid var(--line);
    background:var(--bg); cursor:pointer; font-family:'Inter',sans-serif;
    font-size:13px; font-weight:600; color:var(--ink-muted);
  }
  .profile-pick button.sel{border-color:var(--ink); color:var(--ink); background:#fff;}
  .profile-pick .mini-avatar{
    width:26px;height:26px;border-radius:50%; background-size:cover; background-position:center;
    display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700; font-family:'Baloo 2',sans-serif;
    flex-shrink:0;
  }

  .stepper{display:flex; align-items:center; gap:12px;}
  .stepper button{
    width:30px;height:30px;border-radius:8px; border:1px solid var(--line); background:var(--bg);
    font-size:16px; cursor:pointer;
  }
  .stepper .val{font-family:'Space Mono',monospace; font-size:15px; min-width:20px; text-align:center;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .btn-secondary, .btn-primary{
    flex:1; padding:12px; border-radius:12px; border:none; font-weight:700;
    font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-secondary{background:var(--bg); color:var(--ink-muted);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}

  .rename-row{
    display:flex; align-items:center; gap:12px; margin-bottom:14px;
  }
  .rename-row .avatar-edit{
    width:48px;height:48px;border-radius:50%; flex-shrink:0; cursor:pointer;
    background-size:cover; background-position:center;
    display:grid; place-items:center; color:#fff; font-weight:700; font-family:'Baloo 2',sans-serif;
    position:relative; border:2px solid var(--line);
  }
  .rename-row .avatar-edit::after{
    content:'✎'; position:absolute; bottom:-3px; right:-3px;
    background:var(--ink); color:#fff; width:18px; height:18px; border-radius:50%;
    font-size:9px; display:grid; place-items:center;
  }
  .rename-row input{
    flex:1; padding:9px 11px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); font-size:14px; font-family:'Inter',sans-serif;
  }
  .save-note{
    font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-muted);
    text-align:center; margin-top:14px; min-height:14px; opacity:0; transition:opacity .3s ease;
  }
  .save-note.show{opacity:1;}

  .points-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .points-row:last-child{border-bottom:none;}
  .points-row .avatar-sm{
    width:40px;height:40px;border-radius:50%; flex-shrink:0;
    background-size:cover; background-position:center;
    display:grid; place-items:center; color:#fff; font-weight:700; font-family:'Baloo 2',sans-serif; font-size:14px;
  }
  .points-row .pinfo{flex:1;}
  .points-row .pinfo .pname-big{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px;}
  .points-row .ptotal{
    font-family:'Space Mono',monospace; font-weight:700; font-size:16px; color:#B8860B;
    flex-shrink:0;
  }
  .month-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .month-chip{
    font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-muted);
    background:var(--bg); border-radius:8px; padding:2px 6px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow">
    <span id="dateLabel"></span>
    <div class="eyebrow-actions">
      <button id="pointsBtn">🏆 Points</button>
      <button id="renameBtn">✎ Edit kids</button>
      <div class="day-nav">
        <button id="prevDayBtn" title="Go back one day">◀</button>
        <button id="todayBtn" title="Jump back to today">Today</button>
        <button id="nextDayBtn" title="Move to next day">▶</button>
      </div>
      <button id="lockBtn" title="Lock parent controls">🔒 Lock</button>
    </div>
  </div>
  <div class="titlerow">
    <div class="title-group">
      <h1>Mircescu family tracker</h1>
      <button class="counter-pill" id="counterPill"></button>
    </div>
    <button class="add-task-btn" id="fabBtn"><span class="plus">+</span> Add task</button>
  </div>

  <div class="profiles" id="profiles"></div>

  <div id="sections"></div>
  <div class="save-note" id="saveNote">saved</div>
</div>

<div class="overlay" id="authOverlay">
  <div class="modal">
    <h3>Parent access</h3>
    <div class="field">
      <label>Enter password</label>
      <input type="password" id="authPasswordInput" placeholder="•••••" inputmode="numeric">
      <div id="authError" style="display:none; color:#D9534F; font-size:12px; margin-top:6px;">Incorrect password, try again.</div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="authCancelBtn">Cancel</button>
      <button class="btn-primary" id="authSubmitBtn">Unlock</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>New task</h3>
    <div class="field">
      <label>What needs doing?</label>
      <input type="text" id="taskName" placeholder="e.g. Vacuum the lounge" maxlength="60">
    </div>
    <div class="field">
      <label>For</label>
      <div class="profile-pick" id="profilePick"></div>
    </div>
    <div class="field">
      <label>When</label>
      <div class="seg" id="timeSeg">
        <button data-val="bonus">Bonus</button>
        <button data-val="morning" class="sel">Morning</button>
        <button data-val="afternoon">Afternoon</button>
        <button data-val="evening">Evening</button>
        <button data-val="chores">Chore</button>
      </div>
    </div>
    <div class="field">
      <label>Stars earned</label>
      <div class="stepper">
        <button id="starMinus">−</button>
        <span class="val" id="starVal">1</span>
        <button id="starPlus">+</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn" disabled>Add task</button>
    </div>
  </div>
</div>

<div class="overlay" id="renameOverlay">
  <div class="modal">
    <h3>Edit profiles</h3>
    <div id="renameFields"></div>
    <input type="file" id="photoInput" accept="image/*" style="display:none;">
    <div class="modal-actions">
      <button class="btn-secondary" id="renameCancelBtn">Cancel</button>
      <button class="btn-primary" id="renameSaveBtn">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="pointsOverlay">
  <div class="modal">
    <h3>Points this year</h3>
    <div id="pointsFields"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="pointsCloseBtn" style="flex:1;">Close</button>
    </div>
  </div>
</div>

<div class="overlay" id="congratsOverlay">
  <div class="modal" style="text-align:center;">
    <div style="font-size:44px; margin-bottom:6px;">🎉</div>
    <h3 style="margin-bottom:6px;">Great work today, <span id="congratsName"></span>!</h3>
    <p style="font-family:'Space Mono',monospace; font-size:17px; color:#B8860B; font-weight:700; margin:10px 0 4px;">You got <span id="congratsPoints"></span> points!</p>
    <p style="color:var(--ink-muted); font-size:13px; margin:0 0 6px;">Keep it up!</p>
    <div class="modal-actions">
      <button class="btn-primary" id="congratsCloseBtn" style="flex:1;">Yay!</button>
    </div>
  </div>
</div>

<div class="overlay" id="editOverlay">
  <div class="modal">
    <h3>Edit task</h3>
    <div class="field">
      <label>Task name</label>
      <input type="text" id="editNameInput" maxlength="60">
    </div>
    <div class="field">
      <label>Stars earned</label>
      <div class="stepper">
        <button id="editStarMinus">−</button>
        <span class="val" id="editStarVal">1</span>
        <button id="editStarPlus">+</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="editCancelBtn">Cancel</button>
      <button class="btn-primary" id="editSaveBtn">Save changes</button>
    </div>
  </div>
</div>

<div class="overlay" id="counterOverlay">
  <div class="modal">
    <h3>Family goal</h3>
    <div class="field">
      <label>Target points (combined, all kids)</label>
      <input type="text" inputmode="numeric" id="counterGoalInput" placeholder="e.g. 100">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="counterCancelBtn">Cancel</button>
      <button class="btn-primary" id="counterSaveBtn">Save goal</button>
    </div>
    <button id="counterRestartBtn" style="margin-top:12px; width:100%; background:none; border:none; color:var(--ink-muted); font-size:12px; text-decoration:underline; cursor:pointer;">Restart counter from today</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'skylight-daily-tasks-v2';

const DEFAULT_PROFILES = [
  {id:'luca', name:'Luca', color:'#FF6B5B', photo:null},
  {id:'matei', name:'Matei', color:'#4FA6E0', photo:null},
  {id:'filip', name:'Filip', color:'#8B7CF6', photo:null},
];
const ROUTINE = {
  morning: ['Make bed','Brush teeth','Get dressed'],
  evening: ['Brush teeth','Take a shower','Put on pyjamas','Read a book'],
};
const FILIP_CHORES = [
  'Putting dirty clothes into the hamper',
  'Putting shoes by the front door',
  'Putting toys back into bins after playing',
  'Carrying his own empty plate to the counter',
];
const MATEI_CHORES = [
  ...FILIP_CHORES.filter(c => c !== 'Carrying his own empty plate to the counter'),
  'Making his bed in the morning',
  'Clearing his own plate and wiping his spot at the table',
  'Putting his backpack/coat away after coming home',
];
const LUCA_CHORES = [
  ...MATEI_CHORES,
  'Putting his own clean folded laundry into drawers',
  'Keeping his room reasonably tidy',
];
const CHORES_MAP = { filip: FILIP_CHORES, matei: MATEI_CHORES, luca: LUCA_CHORES };

function buildDefaultTasks(){
  let list = [];
  let idc = 1;
  DEFAULT_PROFILES.forEach(p => {
    Object.keys(ROUTINE).forEach(section => {
      ROUTINE[section].forEach(name => {
        list.push({id:'d'+(idc++), name, profileId:p.id, section, stars:1, done:false});
      });
    });
  });
  list.push({id:'d'+(idc++), name:'Maths lesson (Daddy)', profileId:'luca', section:'afternoon', stars:1, done:false});
  list.push({id:'d'+(idc++), name:'Languages/Other (Mummy)', profileId:'luca', section:'afternoon', stars:1, done:false});
  list.push({id:'d'+(idc++), name:'Lesson (Daddy)', profileId:'matei', section:'afternoon', stars:1, done:false});
  Object.keys(CHORES_MAP).forEach(pid => {
    CHORES_MAP[pid].forEach(name => {
      list.push({id:'d'+(idc++), name, profileId:pid, section:'chores', stars:1, done:false});
    });
  });
  DEFAULT_PROFILES.forEach(p => {
    list.push({id:'d'+(idc++), name:'Kindness', profileId:p.id, section:'bonus', stars:5, done:false});
  });
  return list;
}

let profiles = [];
let tasks = [];
let activeProfileId = 'luca';
let lastReset = null;
let history = { year: new Date().getFullYear(), points: {}, log: [] };
let allTimeTotal = 0;
let familyCounter = { active: false, goal: 0, startValue: 0 };
let kindnessClaimedBy = null;
let parentUnlocked = false;
let pendingAction = null;
const PARENT_PASSWORD = '12345';

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let virtualDateOffsetDays = 0;
function virtualNow(){
  const d = new Date();
  d.setDate(d.getDate() + virtualDateOffsetDays);
  return d;
}
function todayStr(){
  const d = virtualNow();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

const SECTIONS = [
  {key:'bonus', label:'Bonus', icon:'✨'},
  {key:'morning', label:'Morning', icon:'☀️'},
  {key:'afternoon', label:'Afternoon', icon:'🌤️'},
  {key:'evening', label:'Evening', icon:'🌙'},
  {key:'chores', label:"Chores", icon:'📝'},
];

function todaysTasksFor(pid){ return tasks.filter(t => t.profileId === pid); }
function ringGradient(color, pct){
  const deg = Math.round(pct * 360);
  return `${color}; background: conic-gradient(${color} ${deg}deg, rgba(31,42,55,0.12) ${deg}deg)`;
}
function initialsFor(name){ return name.slice(0,2).toUpperCase(); }

const ICON_MAP = [
  [['bed'], '🛏️'],
  [['teeth','tooth'], '🪥'],
  [['pyjama','pajama','pjs'], '👕'],
  [['hamper'], '🧺'],
  [['laundry'], '👕'],
  [['washing machine'], '🧺'],
  [['dress','clothes','uniform'], '👕'],
  [['read','book'], '📖'],

  [['plate'], '🍽️'],
  [['breakfast','lunch','dinner','eat'], '🍽️'],
  [['dish','wash up','washing up'], '🧽'],
  [['tidy','clean','vacuum','room','declutter'], '🧹'],
  [['trash','bin','rubbish','garbage','recycl'], '🗑️'],

function iconFor(name){
  const n = name.toLowerCase();
  for(const [keys, icon] of ICON_MAP){
    if(keys.some(k => n.includes(k))) return icon;
  }
  return '✅';
}
function avatarStyle(p){
  return p.photo ? `background-image:url('${p.photo}'); color:transparent;` : `background:${p.color};`;
}

// ---------- persistence (browser localStorage — works on any host, no account needed) ----------
let saveTimer = null;
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({profiles, tasks, activeProfileId, lastReset, history, allTimeTotal, familyCounter, kindnessClaimedBy, virtualDateOffsetDays, daySnapshots}));
    flashSaved();
  }catch(err){
    console.error('Storage save failed', err);
  }
}
function flashSaved(){
  const el = document.getElementById('saveNote');
  el.textContent = 'saved';
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> el.classList.remove('show'), 900);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      profiles = data.profiles && data.profiles.length ? data.profiles : DEFAULT_PROFILES;
      tasks = data.tasks || buildDefaultTasks();
      activeProfileId = data.activeProfileId || profiles[0].id;
      lastReset = data.lastReset || null;
      history = data.history && data.history.year ? data.history : { year: new Date().getFullYear(), points: {}, log: [] };
      allTimeTotal = typeof data.allTimeTotal === 'number' ? data.allTimeTotal : 0;
      familyCounter = data.familyCounter || { active: false, goal: 0, startValue: 0 };
      virtualDateOffsetDays = typeof data.virtualDateOffsetDays === 'number' ? data.virtualDateOffsetDays : 0;
      daySnapshots = Array.isArray(data.daySnapshots) ? data.daySnapshots : [];
    } else {
      profiles = DEFAULT_PROFILES;
      tasks = buildDefaultTasks();
      lastReset = todayStr();
      history = { year: new Date().getFullYear(), points: {}, log: [] };
      allTimeTotal = 0;
      familyCounter = { active: false, goal: 0, startValue: 0 };
      virtualDateOffsetDays = 0;
    }
  }catch(err){
    profiles = DEFAULT_PROFILES;
    tasks = buildDefaultTasks();
    lastReset = todayStr();
    history = { year: new Date().getFullYear(), points: {}, log: [] };
    allTimeTotal = 0;
    familyCounter = { active: false, goal: 0, startValue: 0 };
    virtualDateOffsetDays = 0;
  }

  tasks.forEach(t => {
    if(t.section === 'evening' && t.name === 'Get dressed'){
      t.name = 'Put on pyjamas';
    }
    if(t.section === 'evening' && t.name === 'Read 20 mins'){
      t.name = 'Read a book';
    }
  });

  profiles.forEach(p => {
    const hasShower = tasks.some(t => t.profileId === p.id && t.section === 'evening' && t.name === 'Take a shower');
    if(!hasShower){
      tasks.push({id:'shower-'+p.id, name:'Take a shower', profileId:p.id, section:'evening', stars:1, done:false});
    }
  });

  tasks.forEach(t => {
    if(t.profileId === 'luca' && t.section === 'afternoon' && t.name === 'Maths lesson with daddy'){
      t.name = 'Maths lesson (Daddy)';
    }
    if(t.profileId === 'luca' && t.section === 'afternoon' && t.name === 'Languages/Other lesson with mummy'){
      t.name = 'Languages/Other (Mummy)';
    }
    if(t.profileId === 'matei' && t.section === 'afternoon' && t.name === 'Lesson with Daddy'){
      t.name = 'Lesson (Daddy)';
    }
  });

  const hasMaths = tasks.some(t => t.profileId === 'luca' && t.section === 'afternoon' && t.name === 'Maths lesson (Daddy)');
  if(!hasMaths){
    tasks.push({id:'maths-luca', name:'Maths lesson (Daddy)', profileId:'luca', section:'afternoon', stars:1, done:false});
  }
  const hasLang = tasks.some(t => t.profileId === 'luca' && t.section === 'afternoon' && t.name === 'Languages/Other (Mummy)');
  if(!hasLang){
    tasks.push({id:'lang-luca', name:'Languages/Other (Mummy)', profileId:'luca', section:'afternoon', stars:1, done:false});
  }
  const hasMateiLesson = tasks.some(t => t.profileId === 'matei' && t.section === 'afternoon' && t.name === 'Lesson (Daddy)');
  if(!hasMateiLesson){
    tasks.push({id:'lesson-matei', name:'Lesson (Daddy)', profileId:'matei', section:'afternoon', stars:1, done:false});
  }

  tasks = tasks.filter(t => !(
    t.section === 'chores' &&
    t.name === 'Carrying his own empty plate to the counter' &&
    (t.profileId === 'matei' || t.profileId === 'luca')
  ));

  Object.keys(CHORES_MAP).forEach(pid => {
    CHORES_MAP[pid].forEach(name => {
      const exists = tasks.some(t => t.profileId === pid && t.section === 'chores' && t.name === name);
      if(!exists){
        tasks.push({id:'chore-'+pid+'-'+Math.random().toString(36).slice(2,8), name, profileId:pid, section:'chores', stars:1, done:false});
      }
    });
  });

  profiles.forEach(p => {
    const hasKindness = tasks.some(t => t.profileId === p.id && t.section === 'bonus' && t.name === 'Kindness');
    if(!hasKindness){
      tasks.push({id:'kindness-'+p.id, name:'Kindness', profileId:p.id, section:'bonus', stars:5, done:false});
    }
  });
  // whoever, if anyone, already has today's Kindness checked keeps the claim
  const claimedTask = tasks.find(t => t.section === 'bonus' && t.name === 'Kindness' && t.done);
  kindnessClaimedBy = claimedTask ? claimedTask.profileId : null;

  dedupeTasks();

  const today = todayStr();
  if(lastReset !== today){
    startNewDay(false);
  }
}

function dedupeTasks(){
  const map = new Map();
  tasks.forEach(t => {
    const key = t.profileId + '|' + t.section + '|' + t.name;
    if(map.has(key)){
      const existing = map.get(key);
      if(t.done) existing.done = true;
    } else {
      map.set(key, t);
    }
  });
  tasks = Array.from(map.values());
}

function startNewDay(shouldSave){
  // log the day that's ending before clearing checkmarks
  if(lastReset){
    profiles.forEach(p => {
      const stars = tasks.filter(t => t.profileId === p.id && t.done).reduce((s,t) => s+t.stars, 0);
      if(stars > 0){
        history.log.push({date: lastReset, profileId: p.id, stars});
        history.points[p.id] = (history.points[p.id] || 0) + stars;
        allTimeTotal += stars;
      }
    });
  }

  tasks.forEach(t => t.done = false);
  lastReset = todayStr();
  kindnessClaimedBy = null;

  // reset the yearly tally on 1 January
  const currentYear = virtualNow().getFullYear();
  if(history.year !== currentYear){
    history = { year: currentYear, points: {}, log: [] };
  }

  if(shouldSave) saveState();
}

// ---------- render ----------
function render(){
  renderDate();
  renderProfiles();
  renderSections();
  renderCounterPill();
  updateLockUI();
}

function updateLockUI(){
  const lockBtn = document.getElementById('lockBtn');
  if(!lockBtn) return;
  lockBtn.disabled = !parentUnlocked;
}

function todaysAllStars(){
  return tasks.filter(t => t.done).reduce((s,t) => s+t.stars, 0);
}
function counterProgress(){
  if(!familyCounter.active) return 0;
  return (allTimeTotal - familyCounter.startValue) + todaysAllStars();
}
function renderCounterPill(){
  const pill = document.getElementById('counterPill');
  if(!familyCounter.active){
    pill.classList.remove('reached');
    pill.innerHTML = `<span class="clabel">🎯 Set a family goal</span>`;
    return;
  }
  const progress = Math.max(0, counterProgress());
  const goal = familyCounter.goal || 1;
  const pct = Math.min(100, Math.round((progress / goal) * 100));
  const reached = progress >= goal;
  pill.classList.toggle('reached', reached);
  pill.innerHTML = `
    <span class="clabel">${reached ? '🎉' : '🎯'} ${progress} / ${familyCounter.goal}</span>
    <span class="counter-track"><span class="counter-fill" style="width:${pct}%"></span></span>
  `;
}

function renderDate(){
  const d = virtualNow();
  document.getElementById('dateLabel').textContent = d.toLocaleDateString('en-GB', {weekday:'long', month:'long', day:'numeric'});
}

function renderProfiles(){
  const wrap = document.getElementById('profiles');
  wrap.innerHTML = '';
  profiles.forEach(p => {
    const pt = todaysTasksFor(p.id);
    const done = pt.filter(t => t.done).length;
    const pct = pt.length ? done / pt.length : 0;
    const starsEarned = pt.filter(t=>t.done).reduce((s,t)=>s+t.stars,0);
    const starsTotal = pt.reduce((s,t)=>s+t.stars,0);

    const btn = document.createElement('button');
    btn.className = 'profile-tab' + (p.id === activeProfileId ? ' active' : '');
    btn.innerHTML = `
      <div class="ring" style="background:${ringGradient(p.color, pct)}">
        <div class="avatar" style="${avatarStyle(p)}">${p.photo ? '' : initialsFor(p.name)}</div>
      </div>
      <div class="pname">${p.name}</div>
      <div class="pstars">⭐ ${starsEarned}/${starsTotal}</div>
    `;
    btn.onclick = () => { activeProfileId = p.id; render(); saveState(); };
    wrap.appendChild(btn);
  });
}

function renderSections(){
  const wrap = document.getElementById('sections');
  wrap.innerHTML = '';
  const myTasks = todaysTasksFor(activeProfileId);

  SECTIONS.forEach(sec => {
    const items = myTasks.filter(t => t.section === sec.key);
    const section = document.createElement('div');
    section.className = 'section';

    const doneCount = items.filter(t=>t.done).length;
    section.innerHTML = `
      <div class="section-head">
        <span class="icon">${sec.icon}</span>
        <h2>${sec.label}</h2>
        <span class="count">${items.length ? doneCount + '/' + items.length : ''}</span>
        ${''}
      </div>
    `;

    const list = document.createElement('div');
    list.className = 'task-list';

    if(items.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing here yet.';
      list.appendChild(empty);
    } else {
      items.forEach(t => list.appendChild(renderTaskCard(t)));
    }

    section.appendChild(list);
    wrap.appendChild(section);
  });
}

function renderTaskCard(t){
  const isKindness = t.section === 'bonus' && t.name === 'Kindness';
  const lockedForOthers = isKindness && kindnessClaimedBy && kindnessClaimedBy !== t.profileId;

  const card = document.createElement('div');
  card.className = 'task-card' + (t.done ? ' done' : '') + (lockedForOthers ? ' locked' : '');

  const check = document.createElement('button');
  check.className = 'check' + (t.done ? ' checked' : '');
  check.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="burst"><span></span><span></span><span></span><span></span><span></span></span>
  `;
  if(lockedForOthers){
    check.disabled = true;
  } else {
    check.onclick = () => toggleTask(t.id, check);
  }

  const icon = document.createElement('div');
  icon.className = 'task-icon';
  icon.textContent = iconFor(t.name);

  const name = document.createElement('div');
  name.className = 'task-name';
  if(lockedForOthers){
    const claimant = profiles.find(p => p.id === kindnessClaimedBy);
    name.textContent = t.name + (claimant ? ' — claimed by ' + claimant.name + ' today' : '');
  } else {
    name.textContent = t.name;
  }

  const editBtn = document.createElement('button');
  editBtn.className = 'edit-btn';
  editBtn.innerHTML = '✎';
  editBtn.title = 'Edit task';
  editBtn.onclick = (e) => { e.stopPropagation(); requireAuth(() => openEditModal(t)); };

  const chip = document.createElement('div');
  chip.className = 'star-chip';
  chip.textContent = '⭐ ' + t.stars;

  const del = document.createElement('button');
  del.className = 'del-btn';
  del.textContent = '✕';
  del.title = 'Remove task';
  del.onclick = (e) => { e.stopPropagation(); requireAuth(() => { tasks = tasks.filter(x => x.id !== t.id); render(); saveState(); }); };

  card.appendChild(check);
  card.appendChild(icon);
  card.appendChild(name);
  card.appendChild(editBtn);
  card.appendChild(chip);
  card.appendChild(del);
  return card;
}

function toggleTask(id, checkEl){
  const t = tasks.find(x => x.id === id);
  if(t.section === 'bonus' && t.name === 'Kindness' && kindnessClaimedBy && kindnessClaimedBy !== t.profileId){
    return; // already claimed by someone else today
  }
  t.done = !t.done;

  if(t.section === 'bonus' && t.name === 'Kindness'){
    kindnessClaimedBy = t.done ? t.profileId : null;
  }

  if(t.done){
    checkEl.classList.add('burstnow');
    setTimeout(()=>checkEl.classList.remove('burstnow'), 500);
  }

  render();
  saveState();

  if(t.done && t.section === 'evening'){
    const eveningTasks = tasks.filter(x => x.profileId === t.profileId && x.section === 'evening');
    const allDone = eveningTasks.length > 0 && eveningTasks.every(x => x.done);
    if(allDone){
      showCongrats(t.profileId);
    }
  }
}

function showCongrats(profileId){
  const p = profiles.find(x => x.id === profileId);
  if(!p) return;
  const points = tasks.filter(x => x.profileId === profileId && x.done).reduce((s,x) => s+x.stars, 0);
  document.getElementById('congratsName').textContent = p.name;
  document.getElementById('congratsPoints').textContent = points;
  document.getElementById('congratsOverlay').classList.add('open');
}

let daySnapshots = [];

function applySnapshot(snap){
  tasks = snap.tasks;
  history = snap.history;
  allTimeTotal = snap.allTimeTotal;
  familyCounter = snap.familyCounter;
  lastReset = snap.lastReset;
  kindnessClaimedBy = snap.kindnessClaimedBy;
  virtualDateOffsetDays = snap.virtualDateOffsetDays;
}

document.getElementById('nextDayBtn').onclick = () => {
  daySnapshots.push(JSON.stringify({tasks, history, allTimeTotal, familyCounter, lastReset, kindnessClaimedBy, virtualDateOffsetDays}));
  virtualDateOffsetDays += 1;
  startNewDay(true);
  render();
  saveState();
};
document.getElementById('prevDayBtn').onclick = () => {
  if(daySnapshots.length > 0){
    const snap = JSON.parse(daySnapshots.pop());
    applySnapshot(snap);
  } else if(virtualDateOffsetDays !== 0){
    // no snapshot to restore (e.g. stale data from an older version) — at least fix the date
    virtualDateOffsetDays -= 1;
  } else {
    return;
  }
  render();
  saveState();
};
document.getElementById('todayBtn').onclick = () => {
  if(daySnapshots.length > 0){
    const snap = JSON.parse(daySnapshots[0]);
    applySnapshot(snap);
    daySnapshots = [];
  } else if(virtualDateOffsetDays !== 0){
    // no snapshot to restore — always guarantee the date itself gets fixed
    virtualDateOffsetDays = 0;
  } else {
    return;
  }
  render();
  saveState();
};

});
renameCancelBtn.onclick = () => renameOverlay.classList.remove('open');
renameOverlay.onclick = (e) => { if(e.target === renameOverlay) renameOverlay.classList.remove('open'); };

photoInput.onchange = (e) => {
  const file = e.target.files[0];
  if(!file || !photoTargetId) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const p = profiles.find(x => x.id === photoTargetId);
      if(p){
        p.photo = dataUrl;
        const el = renameFields.querySelector(`.avatar-edit[data-id="${photoTargetId}"]`);
        if(el){ el.style.backgroundImage = `url('${dataUrl}')`; el.style.backgroundSize='cover'; el.style.backgroundPosition='center'; el.textContent=''; }
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = '';
};

renameSaveBtn.onclick = () => {
  const inputs = renameFields.querySelectorAll('input[type=text]');
  inputs.forEach(inp => {
    const p = profiles.find(x => x.id === inp.dataset.id);
    const val = inp.value.trim();
    if(p && val){ p.name = val; }
  });
  renameOverlay.classList.remove('open');
  render();
  saveState();
};

// ---------- points modal ----------
const pointsOverlay = document.getElementById('pointsOverlay');
const pointsBtn = document.getElementById('pointsBtn');
const pointsFields = document.getElementById('pointsFields');
const pointsCloseBtn = document.getElementById('pointsCloseBtn');

function monthlyBreakdown(profileId){
  const totals = {};
  history.log.forEach(e => {
    if(e.profileId !== profileId) return;
    const month = parseInt(e.date.split('-')[1], 10);
    totals[month] = (totals[month] || 0) + e.stars;
  });
  return totals;
}

pointsBtn.onclick = () => {
  const currentMonth = virtualNow().getMonth() + 1;
  pointsFields.innerHTML = '';
  profiles.forEach(p => {
    const total = history.points[p.id] || 0;
    const monthly = monthlyBreakdown(p.id);
    let chips = '';
    for(let m = 1; m <= currentMonth; m++){
      chips += `<span class="month-chip">${MONTH_NAMES[m-1]}: ${monthly[m] || 0}</span>`;
    }
    const row = document.createElement('div');
    row.className = 'points-row';
    row.innerHTML = `
      <div class="avatar-sm" style="${avatarStyle(p)}">${p.photo ? '' : initialsFor(p.name)}</div>
      <div class="pinfo">
        <div class="pname-big">${p.name}</div>
        <div class="month-chips">${chips}</div>
      </div>
      <div class="ptotal">⭐ ${total}</div>
    `;
    pointsFields.appendChild(row);
  });
  pointsOverlay.classList.add('open');
};
pointsCloseBtn.onclick = () => pointsOverlay.classList.remove('open');
pointsOverlay.onclick = (e) => { if(e.target === pointsOverlay) pointsOverlay.classList.remove('open'); };

// ---------- family goal counter modal ----------
const counterOverlay = document.getElementById('counterOverlay');
const counterPill = document.getElementById('counterPill');
const counterGoalInput = document.getElementById('counterGoalInput');
const counterCancelBtn = document.getElementById('counterCancelBtn');
const counterSaveBtn = document.getElementById('counterSaveBtn');
const counterRestartBtn = document.getElementById('counterRestartBtn');

counterPill.onclick = () => {
  requireAuth(() => {
    counterGoalInput.value = familyCounter.goal ? familyCounter.goal : '';
    counterOverlay.classList.add('open');
    setTimeout(() => counterGoalInput.focus(), 50);
  });
};
counterCancelBtn.onclick = () => counterOverlay.classList.remove('open');
counterOverlay.onclick = (e) => { if(e.target === counterOverlay) counterOverlay.classList.remove('open'); };

counterSaveBtn.onclick = () => {
  const val = parseInt(counterGoalInput.value, 10);
  if(!val || val <= 0) return;
  familyCounter.goal = val;
  if(!familyCounter.active){
    familyCounter.active = true;
    familyCounter.startValue = allTimeTotal;
  }
  counterOverlay.classList.remove('open');
  render();
  saveState();
};

counterRestartBtn.onclick = () => {
  familyCounter.active = true;
  familyCounter.startValue = allTimeTotal;
  const val = parseInt(counterGoalInput.value, 10);
  if(val && val > 0) familyCounter.goal = val;
  counterOverlay.classList.remove('open');
  render();
  saveState();
};

// ---------- parent password gate ----------
const authOverlay = document.getElementById('authOverlay');
const authPasswordInput = document.getElementById('authPasswordInput');
const authError = document.getElementById('authError');
const authCancelBtn = document.getElementById('authCancelBtn');
const authSubmitBtn = document.getElementById('authSubmitBtn');

function requireAuth(actionFn){
  if(parentUnlocked){ actionFn(); return; }
  pendingAction = actionFn;
  authPasswordInput.value = '';
  authError.style.display = 'none';
  authOverlay.classList.add('open');
  setTimeout(() => authPasswordInput.focus(), 50);
}

function closeAuth(){
  authOverlay.classList.remove('open');
  pendingAction = null;
}

authCancelBtn.onclick = closeAuth;
authOverlay.onclick = (e) => { if(e.target === authOverlay) closeAuth(); };

authSubmitBtn.onclick = () => {
  if(authPasswordInput.value === PARENT_PASSWORD){
    parentUnlocked = true;
    authOverlay.classList.remove('open');
    updateLockUI();
    const action = pendingAction;
    pendingAction = null;
    if(action) action();
  } else {
    authError.style.display = 'block';
    authPasswordInput.value = '';
    authPasswordInput.focus();
  }
};
authPasswordInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') authSubmitBtn.click(); });

document.getElementById('lockBtn').onclick = () => {
  parentUnlocked = false;
  updateLockUI();
};

// ---------- init ----------
function init(){
  document.getElementById('sections').innerHTML = '<div class="loading">Loading your tasks…</div>';
  loadState();
  render();
  saveState();
}
init();
</script>
